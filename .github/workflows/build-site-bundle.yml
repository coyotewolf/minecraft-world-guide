name: Verify and publish website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-publication-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-checks:
    name: security-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: node --test database/edge-security.test.mjs session-storage.test.js account-loader.test.js cloud-ai/client-access.test.js
      - run: npm audit --package-lock-only --audit-level=high
        working-directory: cloud-ai
      - run: ./node_modules/.bin/esbuild app.js --bundle --minify --format=esm --target=es2022 --outfile=assets/app.min.js
      - run: node --check assets/app.min.js
      - name: Refresh public bundle cache key
        env:
          SITE_REVISION: ${{ github.sha }}
        run: node tools/version_public_bundle.mjs
      - run: node tools/prepare_public_site.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: security-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
