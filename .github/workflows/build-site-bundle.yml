name: Build website bundle

on:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-site-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-bundle
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: ./node_modules/.bin/esbuild app.js --bundle --minify --format=esm --target=es2022 --outfile=assets/app.min.js

      - name: Verify bundle
        run: node --check assets/app.min.js

      - name: Refresh bundle cache key
        shell: bash
        run: |
          short="${GITHUB_SHA:0:8}"
          node - "$short" <<'NODE'
          const fs=require('fs');
          const short=process.argv[2];
          const file='index.html';
          let s=fs.readFileSync(file,'utf8');
          s=s.replace(/assets\/app\.min\.js\?v=[^"]+/,'assets/app.min.js?v='+short);
          fs.writeFileSync(file,s);
          NODE

      - name: Commit built bundle
        shell: bash
        run: |
          if git diff --quiet -- assets/app.min.js index.html; then
            echo "Bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.min.js index.html
          git commit -m "Build latest website bundle"
          git push
