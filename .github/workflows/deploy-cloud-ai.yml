name: Deploy Cloudflare game assistant

on:
  push:
    branches: [main]
    paths:
      - "cloud-ai/**"
      - "data/ai/**"
      - "data/articles.json"
      - "data/collections.json"
      - "data/inventory.json"
      - "tools/build_gameplay_knowledge.mjs"
      - ".github/workflows/deploy-cloud-ai.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-game-assistant-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud-ai/package-lock.json

      - name: Rebuild whole-pack gameplay knowledge
        run: node tools/build_gameplay_knowledge.mjs

      - name: Verify generated knowledge
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('data/ai/gameplay-knowledge-index.json', 'utf8'));
          if (!Array.isArray(index.shards) || !index.shards.length) throw new Error('Gameplay knowledge index has no shards');
          let total = 0;
          for (const shard of index.shards) {
            const rows = JSON.parse(fs.readFileSync('data/ai/' + shard.file, 'utf8'));
            if (!Array.isArray(rows) || rows.length !== shard.count) throw new Error('Invalid shard: ' + shard.file);
            total += rows.length;
          }
          if (total !== index.count) throw new Error('Knowledge count mismatch: ' + total + ' != ' + index.count);
          console.log('Validated gameplay knowledge records:', total);
          NODE

      - name: Install Worker dependencies
        working-directory: cloud-ai
        run: npm ci

      - name: Run Worker tests
        working-directory: cloud-ai
        run: npm run check

      - name: Validate Cloudflare deployment
        working-directory: cloud-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run preview-deploy

      - name: Deploy Worker
        working-directory: cloud-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
