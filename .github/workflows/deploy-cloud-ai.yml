name: Deploy Cloudflare game assistant

on:
  push:
    branches: [main]
    paths:
      - "cloud-ai/**"
      - "data/ai/**"
      - "data/articles.json"
      - "data/collections.json"
      - "data/inventory.json"
      - "tools/build_gameplay_knowledge.mjs"
      - "tools/build_relation_knowledge.mjs"
      - "tools/build_coverage_index.mjs"
      - "tools/build_assistant_bootstrap.mjs"
      - "ai-search.js"
      - "ai-evidence.js"
      - "evidence-integrity.js"
      - "subject-resolver.js"
      - "tools/build_subject_registry.py"
      - "ai-search.test.js"
      - ".github/workflows/deploy-cloud-ai.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-game-assistant-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud-ai/package-lock.json

      - name: Rebuild whole-pack gameplay knowledge
        run: |
          node tools/build_gameplay_knowledge.mjs
          node tools/build_relation_knowledge.mjs
          node tools/build_coverage_index.mjs
          node tools/build_assistant_bootstrap.mjs

      - name: Verify generated knowledge
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('data/ai/gameplay-knowledge-index.json', 'utf8'));
          if (!Array.isArray(index.shards) || !index.shards.length) throw new Error('Gameplay knowledge index has no shards');
          let total = 0;
          for (const shard of index.shards) {
            const rows = JSON.parse(fs.readFileSync('data/ai/' + shard.file, 'utf8'));
            if (!Array.isArray(rows) || rows.length !== shard.count) throw new Error('Invalid shard: ' + shard.file);
            total += rows.length;
          }
          if (total !== index.count) throw new Error('Knowledge count mismatch: ' + total + ' != ' + index.count);
          const all = index.shards.flatMap(shard => JSON.parse(fs.readFileSync('data/ai/' + shard.file, 'utf8')));
          const gundyr = all.find(row => row.id === 'runtime:slu:item:gundyr_axespear');
          if (!gundyr || !String(gundyr.playerSummary).includes('最大耐久度：1800')) throw new Error('SLU runtime item extraction missing Gundyr durability');
          const runtimeCount = all.filter(row => String(row.id||'').startsWith('runtime:slu:item:')).length;
          if (runtimeCount < 700) throw new Error('SLU runtime item extraction incomplete: ' + runtimeCount);
          console.log('Validated gameplay knowledge records:', total, 'SLU runtime items:', runtimeCount);
          NODE

      - name: Verify Traditional Chinese translation dictionaries
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          function verify(indexFile) {
            const index = JSON.parse(fs.readFileSync('data/ai/' + indexFile, 'utf8'));
            if (!Array.isArray(index.shards) || !index.shards.length) throw new Error(indexFile + ' has no shards');
            let total = 0;
            for (const shard of index.shards) {
              const rows = JSON.parse(fs.readFileSync('data/ai/' + shard, 'utf8'));
              if (!rows || Array.isArray(rows) || typeof rows !== 'object') throw new Error('Invalid translation shard: ' + shard);
              total += Object.keys(rows).length;
            }
            if (total !== index.count) throw new Error(indexFile + ' count mismatch: ' + total + ' != ' + index.count);
            console.log('Validated', indexFile, total, 'translations');
          }
          verify('translation-registry-index.json');
          verify('translation-zh-tw-index.json');
          NODE

      - name: Install Worker dependencies
        working-directory: cloud-ai
        run: npm ci

      - name: Run Worker tests
        working-directory: cloud-ai
        run: npm run check

      - name: Resolve Cloudflare account ID
        id: cloudflare-account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
          success="$(jq -r '.success // false' <<<"$response")"
          if [ "$success" != "true" ]; then
            echo "::error::Cloudflare API token could not list accounts."
            jq -r '.errors // []' <<<"$response"
            exit 1
          fi
          count="$(jq '.result | length' <<<"$response")"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one Cloudflare account for this token, got $count. Scope the token to one account."
            exit 1
          fi
          account_id="$(jq -r '.result[0].id' <<<"$response")"
          if ! [[ "$account_id" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Cloudflare returned an invalid account ID."
            exit 1
          fi
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
          echo "Resolved Cloudflare account successfully."

      - name: Validate Cloudflare deployment
        working-directory: cloud-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-account.outputs.account_id }}
        run: npm run preview-deploy

      - name: Deploy Worker
        working-directory: cloud-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-account.outputs.account_id }}
        run: npm run deploy
