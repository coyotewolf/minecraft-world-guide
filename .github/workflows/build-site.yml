name: Build site bundle
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'atlas-reader.js'
      - 'atlas-reader.css'
      - 'avatar.js'
      - 'recipe-view.js'
      - 'recipe-labels.js'
      - 'guide-progress.js'
      - 'key-guide.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/build.mjs'
      - '.github/workflows/build-site.yml'
permissions:
  contents: write
concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- assets/app.min.js; then
            echo "Bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.min.js
          git commit -m "Build website bundle"
          git push
